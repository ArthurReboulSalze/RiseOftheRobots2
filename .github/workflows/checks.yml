name: Code and synthetic fixtures
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-2022
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements.txt
      - run: python TOOLS/audit_repo.py --staged
      - run: python -m unittest discover -s TOOLS/tests -v
      - run: python TOOLS/test_image_codecs.py
      - if: matrix.python == '3.14'
        run: python TOOLS/bootstrap_port.py
      - if: matrix.python == '3.14'
        run: cmake -S PORT -B PORT/build -G "Visual Studio 17 2022" -A x64
      - if: matrix.python == '3.14'
        run: cmake --build PORT/build --config Release
      - if: matrix.python == '3.14'
        run: ctest --test-dir PORT/build -C Release --output-on-failure
